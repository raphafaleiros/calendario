<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Natal RA</title>

  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    }
    #botao-som {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(179, 0, 0, 0.9); color: white; border: 2px solid #d4af37;
      padding: 12px 24px; border-radius: 25px; font-family: sans-serif;
      font-size: 15px; font-weight: bold; cursor: pointer; z-index: 99999;
    }
  </style>
</head>
<body>

  <button id="botao-som" onclick="ligarSom()">🔊 Ativar Música de Natal</button>

  <!-- Apontando diretamente para ./targets.mind (sem bloqueio de rede) -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="modeloNatal" src=""></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Alvo 0 (Calendário Cheio) -->
    
      <a-gltf-model src="#modeloNatal" rotation="90 0 0" position="0 0 0" scale="0.4 0.4 0.4"></a-gltf-model>
    

    <!-- Alvo 1 (Calendário Vazio) -->
    
      <a-gltf-model src="#modeloNatal" rotation="90 0 0" position="0 0 0" scale="0.4 0.4 0.4"></a-gltf-model>
    

  </a-scene>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const diaAtual = parametros.get('dia') || '1';

    // Carregamento direto local (muito mais rápido)
    document.getElementById('modeloNatal').setAttribute('src', `./${diaAtual}.glb`);
    const musicaNatal = new Audio(`./musicanatal${diaAtual}.mp3`);

    function ligarSom() {
      musicaNatal.loop = true;
      musicaNatal.play().catch(e => {});
      document.getElementById('botao-som').style.display = 'none';
    }
  </script>

</body>
</html>
