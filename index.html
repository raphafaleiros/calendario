<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendário de Natal RA</title>

    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
      #botao-som {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background: #b30000;
        color: #ffffff;
        border: 2px solid #d4af37;
        padding: 12px 24px;
        border-radius: 25px;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        z-index: 99999;
      }
      #etiqueta-versao {
        position: fixed;
        bottom: 10px;
        right: 12px;
        background: rgba(0, 0, 0, 0.7);
        color: #d4af37;
        padding: 4px 10px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 11px;
        z-index: 99999;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="etiqueta-versao">Versão 20.0</div>
    <button id="botao-som" onclick="tocarMusica()">🔊 Ativar Música</button>

    <a-scene
      mindar-image="imageTargetSrc: https://jsdelivr.net;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-box position="0 0 0.05" scale="0.15 0.15 0.15" color="#ff0000"></a-box>
        <a-gltf-model
          id="modelo-natal"
          rotation="90 0 0"
          position="0 0 0"
          scale="0.5 0.5 0.5"
        ></a-gltf-model>
      
    </a-scene>

    <script>
      const parametros = new URLSearchParams(window.location.search);
      const dia = parametros.get('dia') || '3';

      const arquivoGlb = (dia === '1') ? './animated_snowglobe.glb' : `./${dia}.glb`;
      const escala = (dia === '1') ? '0.015 0.015 0.015' : '0.5 0.5 0.5';

      const modelo = document.getElementById('modelo-natal');
      modelo.setAttribute('src', arquivoGlb);
      modelo.setAttribute('scale', escala);

      const musica = new Audio(`./musicanatal${dia}.mp3`);
      function tocarMusica() {
        musica.loop = true;
        musica.play().catch(() => {});
        document.getElementById('botao-som').style.display = 'none';
      }
    </script>
  </body>
</html>
