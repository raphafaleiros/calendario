<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calendário de Natal RA</title>

  <!-- Carregando 100% do seu próprio GitHub (Zero bloqueio de rede ou extensão) -->
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #tela-inicio {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #121212; color: #fff; z-index: 99999; text-align: center; padding: 20px; box-sizing: border-box;
    }
    #btn-iniciar {
      background: #2e7d32; color: #fff; border: 3px solid #d4af37;
      padding: 16px 32px; border-radius: 30px; font-size: 18px; font-weight: bold;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #aviso-topo {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); color: #fff; padding: 10px 18px;
      border-radius: 20px; font-size: 13px; font-weight: bold;
      z-index: 99998; text-align: center; width: 85%; max-width: 320px; display: none;
    }
    #botao-som {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: #b30000; color: #fff; border: 2px solid #d4af37;
      padding: 12px 24px; border-radius: 25px; font-size: 15px; font-weight: bold;
      cursor: pointer; z-index: 99998; display: none;
    }
    #etiqueta-versao {
      position: fixed; bottom: 10px; right: 12px;
      background: rgba(0, 0, 0, 0.6); color: #d4af37;
      padding: 4px 10px; border-radius: 8px; font-size: 11px;
      z-index: 999999; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="etiqueta-versao">Versão 9.0</div>

  <div id="tela-inicio">
    <h2 style="color: #d4af37; margin-bottom: 10px;">🎄 Calendário de Natal RA</h2>
    <p id="subtitulo-dia" style="color: #ccc; margin-bottom: 25px;">Surpresa pronta!</p>
    <button id="btn-iniciar" onclick="iniciarCamera()">📷 Iniciar Câmera RA</button>
    <p id="log-erro" style="color: #ff6b6b; font-size: 13px; margin-top: 20px; max-width: 320px;"></p>
  </div>

  <div id="aviso-topo">🎄 Aponte a câmera para o Calendário!</div>
  <button id="botao-som" onclick="tocarMusica()">🔊 Ativar Música</button>

  <a-scene 
    id="cena-ar"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: no;" 
    background="transparent: true"
    color-space="sRGB" 
    renderer="colorManagement: true; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
      <a-gltf-model id="modelo-cheio" rotation="90 0 0" position="0 0 0"></a-gltf-model>
    

    
      <a-gltf-model id="modelo-vazio" rotation="90 0 0" position="0 0 0"></a-gltf-model>
    
  </a-scene>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const dia = parametros.get('dia') || '3';
    const btn = document.getElementById('btn-iniciar');
    const erroTxt = document.getElementById('log-erro');
    const cena = document.querySelector('a-scene');

    document.getElementById('subtitulo-dia').innerText = `Surpresa do Dia ${dia}`;

    const arquivoGlb = (dia === '1') ? './animated_snowglobe.glb' : `./${dia}.glb`;
    const escala = (dia === '1') ? '0.008 0.008 0.008' : '0.4 0.4 0.4';

    const modCheio = document.getElementById('modelo-cheio');
    const modVazio = document.getElementById('modelo-vazio');
    modCheio.setAttribute('src', arquivoGlb);
    modCheio.setAttribute('scale', escala);
    modVazio.setAttribute('src', arquivoGlb);
    modVazio.setAttribute('scale', escala);

    const musica = new Audio(`./musicanatal${dia}.mp3`);
    function tocarMusica() {
      musica.loop = true;
      musica.play().catch(() => {});
      document.getElementById('botao-som').style.display = 'none';
    }

    function iniciarCamera() {
      btn.disabled = true;
      btn.innerText = "⏳ Abrindo câmera...";
      erroTxt.innerText = "";

      try {
        if (!window.AFRAME) {
          throw new Error("O arquivo aframe.min.js não foi encontrado no seu GitHub.");
        }
        if (!cena || !cena.systems || !cena.systems['mindar-image-system']) {
          throw new Error("O arquivo mindar-image-aframe.prod.js não foi encontrado no seu GitHub.");
        }

        const arSystem = cena.systems['mindar-image-system'];

        cena.addEventListener("arReady", () => {
          document.getElementById('tela-inicio').style.display = 'none';
          document.getElementById('aviso-topo').style.display = 'block';
          document.getElementById('botao-som').style.display = 'block';
        });

        cena.addEventListener("arError", () => {
          btn.disabled = false;
          btn.innerText = "📷 Tentar Novamente";
          erroTxt.innerText = "Erro ao abrir câmera. Verifique as permissões do navegador.";
        });

        arSystem.start();
      } catch (e) {
        btn.disabled = false;
        btn.innerText = "📷 Iniciar Câmera RA";
        erroTxt.innerText = e.message;
      }
    }
  </script>

</body>
</html>
