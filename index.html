<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Calendário de Natal RA</title>

  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: transparent !important;
      font-family: sans-serif;
    }
    #tela-inicio {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #121212; color: #fff; z-index: 99999; text-align: center; padding: 20px; box-sizing: border-box;
    }
    #btn-iniciar {
      background: #2e7d32; color: #fff; border: 3px solid #d4af37;
      padding: 16px 32px; border-radius: 30px; font-size: 18px; font-weight: bold;
      cursor: pointer;
    }
    #aviso-topo {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 18px;
      border-radius: 20px; font-size: 13px; font-weight: bold;
      z-index: 99998; text-align: center; width: 85%; max-width: 320px; display: none;
    }
    #etiqueta-versao {
      position: fixed; bottom: 10px; right: 12px;
      background: rgba(0, 0, 0, 0.6); color: #d4af37;
      padding: 4px 10px; border-radius: 8px; font-size: 11px;
      z-index: 999999; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="etiqueta-versao">Versão 14.0</div>

  <div id="tela-inicio">
    <h2 style="color: #d4af37; margin-bottom: 10px;">🎄 Teste Local MindAR</h2>
    <button id="btn-iniciar" onclick="iniciarCamera()">📷 Iniciar Câmera RA</button>
    <p id="log-erro" style="color: #ff6b6b; font-size: 13px; margin-top: 20px; max-width: 320px;"></p>
  </div>

  <div id="aviso-topo">🎄 Aponte para o cartão verde na tela do PC!</div>

  <a-scene 
    id="cena-ar"
    mindar-image="imageTargetSrc: ./card.mind; autoStart: false; uiScanning: yes; uiLoading: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-light type="ambient" color="#ffffff" intensity="1.5"></a-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
      <a-box position="0 0 0.1" scale="0.3 0.3 0.3" color="#ff0000"></a-box>
      <a-gltf-model src="./3.glb" rotation="90 0 0" position="0 0 0" scale="0.8 0.8 0.8"></a-gltf-model>
    
  </a-scene>

  <script>
    const btn = document.getElementById('btn-iniciar');
    const erroTxt = document.getElementById('log-erro');
    const avisoTopo = document.getElementById('aviso-topo');
    const cena = document.querySelector('a-scene');

    cena.addEventListener('loaded', () => {
      const alvo0 = document.getElementById('alvo-0');
      alvo0.addEventListener("targetFound", () => {
        avisoTopo.innerText = "✅ FUNCIONOU! Alvo reconhecido!";
      });
      alvo0.addEventListener("targetLost", () => {
        avisoTopo.innerText = "🎄 Aponte para o cartão verde na tela do PC!";
      });
    });

    function iniciarCamera() {
      btn.disabled = true;
      btn.innerText = "⏳ Abrindo...";
      erroTxt.innerText = "";

      try {
        const arSystem = cena.systems['mindar-image-system'];
        if (!arSystem) {
          throw new Error("Aguarde 2 segundos e toque novamente.");
        }

        cena.addEventListener("arReady", () => {
          document.getElementById('tela-inicio').style.display = 'none';
          avisoTopo.style.display = 'block';
        });

        cena.addEventListener("arError", () => {
          btn.disabled = false;
          btn.innerText = "📷 Tentar Novamente";
          erroTxt.innerText = "Erro ao ler ./card.mind ou abrir câmera.";
        });

        arSystem.start();
      } catch (e) {
        btn.disabled = false;
        btn.innerText = "📷 Iniciar Câmera RA";
        erroTxt.innerText = e.message;
      }
    }
  </script>

</body>
</html>
