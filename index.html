<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Natal RA</title>

  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    #botao-som {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: #b30000; color: #fff; border: 2px solid #d4af37;
      padding: 12px 24px; border-radius: 25px; font-family: sans-serif;
      font-size: 15px; font-weight: bold; cursor: pointer; z-index: 99999;
    }
  </style>
</head>
<body>

  <button id="botao-som" onclick="ativarSom()">🔊 Ativar Música</button>

  <!-- A cena agora está escrita direto no HTML, sem document.write para travar -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    
      <a-gltf-model id="modelo-3d" rotation="90 0 0" position="0 0 0"></a-gltf-model>
    
  </a-scene>

  <script>
    const dia = new URLSearchParams(window.location.search).get('dia') || '3';
    const glb = (dia === '1') ? './animated_snowglobe.glb' : `./${dia}.glb`;
    const esc = (dia === '1') ? '0.008 0.008 0.008' : '0.4 0.4 0.4';

    const modelo = document.getElementById('modelo-3d');
    modelo.setAttribute('src', glb);
    modelo.setAttribute('scale', esc);

    const musica = new Audio(`./musicanatal${dia}.mp3`);
    function ativarSom() {
      musica.loop = true;
      musica.play().catch(() => {});
      document.getElementById('botao-som').style.display = 'none';
    }
  </script>

</body>
</html>
