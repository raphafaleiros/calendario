<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste de Câmera</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; text-align:center; padding-top:40px;">

  <h2>Teste Isolado de Câmera v2</h2>
  <button onclick="ligar()" style="padding:16px 30px; font-size:18px; background:#2e7d32; color:#fff; border:none; border-radius:25px;">
    📷 Testar Câmera Agora
  </button>
  
  <p id="aviso" style="color:#ffeb3b; margin-top:20px; padding:0 15px;"></p>
  <video id="video" autoplay playsinline style="width:90%; max-width:350px; margin-top:15px; border:2px solid #d4af37;"></video>

  <script>
    async function ligar() {
      const aviso = document.getElementById('aviso');
      aviso.innerText = "⏳ Pedindo permissão ao celular...";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById('video').srcObject = stream;
        aviso.innerText = "✅ Câmera funcionando perfeitamente!";
      } catch (erro) {
        aviso.innerText = "❌ Bloqueado pelo aparelho: " + erro.name + " - " + erro.message;
      }
    }
  </script>

</body>
</html>
