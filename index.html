<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Validação Final MindAR</title>
    <script src="./aframe.min.js"></script>
    <script src="./mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div style="position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #d4af37; padding: 6px 12px; border-radius: 8px; font-family: sans-serif; font-size: 12px; z-index: 99999;">
      Versão 25.0
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./card.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      
        <a-box position="0 0 0.25" scale="0.5 0.5 0.5" color="#ff0000"></a-box>
      
    </a-scene>
  </body>
</html>
